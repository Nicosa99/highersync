<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - HigherSync Archive</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --void: #07070A;
      --void-up: #0D0D12;
      --void-mid: #14141C;
      --void-card: #111118;
      --gold: #D4AF37;
      --gold-bright: #E8C84A;
      --gold-dim: #A8892C;
      --gold-glow: rgba(212,175,55,0.12);
      --gold-glow-strong: rgba(212,175,55,0.25);
      --quantum: #5B52F0;
      --quantum-light: #8B84FF;
      --quantum-glow: rgba(91,82,240,0.15);
      --red-soft: #E25555;
      --green-soft: #5BBF72;
      --text: #E8E3D9;
      --text-mid: #9B9588;
      --text-dim: #5E5A52;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 400;
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(7, 7, 10, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212,175,55,0.08);
      padding: 15px 0;
    }
    .top-nav .wrap {
      display: flex; justify-content: space-between; align-items: center;
    }
    .top-nav-logo {
      font-family: var(--serif); font-weight: 700; font-size: 1.4rem;
      color: var(--text); text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      position: relative; z-index: 1100;
    }
    .nav-links {
      display: flex; gap: 30px; align-items: center;
    }
    .nav-links a {
      font-family: var(--sans); font-size: 0.9rem; font-weight: 600;
      color: var(--text-mid); text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em;
      transition: color 0.3s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--gold);
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      z-index: 1100;
      padding: 10px;
    }
    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      transition: 0.3s;
    }

    @media (max-width: 850px) {
      .menu-toggle { display: flex; }
      .nav-links {
        position: fixed;
        top: 0; right: 0; bottom: 0; left: 0;
        background: rgba(7, 7, 10, 0.98);
        backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 35px;
        padding: 40px;
        transform: translateX(100%);
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 1050;
        height: 100vh;
      }
      .nav-links.open { transform: translateX(0); }
      .nav-links a { font-size: 1.4rem; font-weight: 700; }
      
      /* Hamburger Animation */
      .menu-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
      .menu-toggle.open span:nth-child(2) { opacity: 0; }
      .menu-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
    }
    .nav-cta {
      padding: 8px 18px; border: 1px solid var(--gold-dim); border-radius: 4px;
      color: var(--gold) !important; font-size: 0.8rem;
    }
    .nav-cta:hover {
      background: var(--gold-glow);
    }

    /* ── AMBIENT ── */
    .ambient {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
              radial-gradient(ellipse 800px 600px at 15% 20%, rgba(91,82,240,0.035) 0%, transparent 70%),
              radial-gradient(ellipse 600px 500px at 85% 75%, rgba(212,175,55,0.025) 0%, transparent 70%);
    }
    .ambient::after {
      content: '';
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      background-size: 256px;
    }

    main { position: relative; z-index: 1; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
    .sec { padding: 110px 0; position: relative; }

    h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; line-height: 1.12; }
    h1 { font-size: clamp(2.6rem, 5.5vw, 4rem); letter-spacing: -0.01em; }
    h2 { font-size: clamp(2rem, 4vw, 3rem); }
    h3 { font-size: clamp(1.25rem, 2.5vw, 1.65rem); }
    p { color: var(--text-mid); max-width: 620px; line-height: 1.75; }

    .gold { color: var(--gold); }
    .quantum { color: var(--quantum-light); }

    .tag {
      font-family: var(--sans); font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--gold); display: inline-flex; align-items: center; gap: 10px;
    }
    .tag::before { content: ''; width: 20px; height: 1px; background: var(--gold-dim); }

    .sep {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), rgba(91,82,240,0.08), transparent);
    }

    /* ── CTA ── */
    .cta {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--sans); font-weight: 700; font-size: 1rem;
      letter-spacing: 0.03em;
      color: var(--void); background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      padding: 18px 40px; border: none; border-radius: 8px;
      cursor: pointer; text-decoration: none;
      transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
      box-shadow: 0 0 40px var(--gold-glow), 0 4px 24px rgba(0,0,0,0.4);
      position: relative; overflow: hidden;
    }
    .cta::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.3) 50%, transparent 65%);
      transform: translateX(-130%); transition: transform 0.65s;
    }
    .cta:hover::after { transform: translateX(130%); }
    .cta:hover { box-shadow: 0 0 60px var(--gold-glow-strong), 0 8px 32px rgba(0,0,0,0.5); transform: translateY(-2px); }

    .cta-ghost {
      background: transparent; color: var(--gold);
      border: 1px solid rgba(212,175,55,0.25); box-shadow: none;
      font-size: 0.9rem; padding: 14px 30px;
    }
    .cta-ghost::after { display: none; }
    .cta-ghost:hover { background: var(--gold-glow); box-shadow: 0 0 30px var(--gold-glow); }

    /* ── STICKY BAR ── */
    .sticky-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      background: linear-gradient(90deg, rgba(91,82,240,0.15), rgba(212,175,55,0.1));
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      padding: 10px 20px;
      display: flex; justify-content: center; align-items: center; gap: 16px;
      font-size: 0.82rem; font-weight: 500;
    }
    .sticky-bar span { color: var(--text-mid); }
    .sticky-bar strong { color: var(--gold); font-weight: 700; }
    .timer-box {
      font-family: var(--sans); font-weight: 800; font-size: 0.85rem;
      color: var(--quantum-light);
      background: rgba(91,82,240,0.12); border: 1px solid rgba(91,82,240,0.2);
      padding: 4px 12px; border-radius: 5px; font-variant-numeric: tabular-nums;
    }
    .sticky-link {
      color: var(--gold); text-decoration: none; font-weight: 700;
      border-bottom: 1px solid rgba(212,175,55,0.3);
      transition: border-color 0.3s;
    }
    .sticky-link:hover { border-color: var(--gold); }

    /* ── HERO ── */
    .hero { min-height: 100vh; display: flex; align-items: center; padding-top: 100px; position: relative; overflow: hidden; }
    .hero::before {
      content: ''; position: absolute; top: -15%; right: -8%;
      width: 750px; height: 750px;
      background: radial-gradient(circle, rgba(91,82,240,0.06) 0%, transparent 60%);
      border-radius: 50%; animation: drift 12s ease-in-out infinite;
    }
    .hero::after {
      content: ''; position: absolute; bottom: -10%; left: -5%;
      width: 550px; height: 550px;
      background: radial-gradient(circle, rgba(212,175,55,0.04) 0%, transparent 60%);
      border-radius: 50%; animation: drift 15s ease-in-out infinite reverse;
    }
    @keyframes drift {
      0%,100% { transform: translate(0,0) scale(1); opacity: 1; }
      50% { transform: translate(20px,-15px) scale(1.1); opacity: 0.6; }
    }
    .hero-inner { position: relative; z-index: 2; max-width: 780px; }

    .super-title {
      font-family: var(--sans); font-weight: 500; font-size: 0.82rem;
      letter-spacing: 0.06em; color: var(--quantum-light);
      margin-bottom: 22px; display: flex; align-items: center; gap: 12px;
    }
    .super-title::before { content: ''; width: 28px; height: 1px; background: var(--quantum-light); }
    .hero h1 { margin-bottom: 22px; }
    .hero h1 em { font-style: italic; color: var(--gold); }
    .hero-sub {
      font-size: 1.1rem; max-width: 580px; margin-bottom: 14px; line-height: 1.8;
    }
    .hero-mantra {
      font-family: var(--serif); font-style: italic; font-size: 1.15rem;
      color: rgba(212,175,55,0.7); margin-bottom: 36px; max-width: 520px;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 40px; }

    .micro-proof {
      display: flex; flex-wrap: wrap; gap: 20px; align-items: center;
      font-size: 0.78rem; color: var(--text-dim);
    }
    .micro-proof span { display: flex; align-items: center; gap: 6px; }
    .micro-stars { color: var(--gold); letter-spacing: 1px; }

    /* ── AUTHORITY ── */
    .authority {
      padding: 20px 0;
      border-top: 1px solid rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      background: rgba(255,255,255,0.01);
    }
    .authority-inner {
      display: flex; justify-content: center; align-items: center;
      gap: 36px; flex-wrap: wrap;
    }
    .auth-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--text-dim);
    }
    .auth-item {
      font-size: 0.75rem; font-weight: 500; color: var(--text-dim);
      display: flex; align-items: center; gap: 8px; opacity: 0.6;
    }
    .auth-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--quantum-light); }

    /* ── PROBLEM ── */
    .problem { background: var(--void-up); }
    .problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
    .problem h2 { margin-bottom: 28px; }
    .problem p { margin-bottom: 16px; }
    .problem-punch { color: var(--text) !important; font-weight: 500; }

    .barrier-card {
      background: var(--void-card); border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px; padding: 36px; position: relative; overflow: hidden;
    }
    .barrier-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--red-soft), var(--quantum), var(--gold));
    }
    .barrier-title {
      font-family: var(--sans); font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 20px; text-align: center;
    }
    .barrier-stack { display: flex; flex-direction: column; gap: 8px; }
    .b-layer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-radius: 8px;
      font-size: 0.82rem; font-weight: 600;
    }
    .b-hz { font-weight: 400; font-size: 0.72rem; opacity: 0.6; }
    .b-beta { background: rgba(226,85,85,0.07); border: 1px solid rgba(226,85,85,0.12); color: var(--red-soft); }
    .b-alpha { background: rgba(234,179,8,0.05); border: 1px solid rgba(234,179,8,0.08); color: #EAB308; }
    .b-theta { background: rgba(91,82,240,0.06); border: 1px solid rgba(91,82,240,0.12); color: var(--quantum-light); }
    .b-epsilon { background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.12); color: var(--gold); }

    .lock-line {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; margin: 4px 0;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--red-soft);
    }
    .lock-line::before, .lock-line::after {
      content: ''; flex: 1; height: 1px;
      border-top: 1px dashed rgba(226,85,85,0.3);
    }

    /* ── HIGHER SELF BRIDGE ── */
    .bridge { text-align: center; }
    .bridge h2 { margin-bottom: 20px; }
    .bridge > .wrap > p { margin: 0 auto 20px; text-align: center; }
    .bridge-text { max-width: 700px; margin: 0 auto; }
    .bridge-text p { text-align: center; margin: 0 auto 18px; }
    .bridge-highlight {
      font-family: var(--serif); font-size: 1.3rem; font-weight: 600;
      color: var(--text); text-align: center;
      padding: 32px; margin: 32px auto 0;
      max-width: 600px;
      border-left: 2px solid var(--gold-dim);
      border-right: 2px solid var(--gold-dim);
    }

    /* ── 3 STEPS ── */
    .steps { background: var(--void-up); }
    .steps h2 { text-align: center; margin-bottom: 56px; }
    .steps-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 28px; }
    .step-card {
      text-align: center; padding: 40px 28px;
      background: var(--void-card); border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px; position: relative;
    }
    .step-num {
      font-family: var(--serif); font-size: 3.5rem; font-weight: 700;
      color: rgba(212,175,55,0.08); position: absolute; top: 16px; left: 24px;
    }
    .step-icon {
      width: 56px; height: 56px; margin: 0 auto 20px;
      background: rgba(91,82,240,0.08); border: 1px solid rgba(91,82,240,0.12);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
    }
    .step-icon svg { width: 24px; height: 24px; stroke: var(--quantum-light); fill: none; }
    .step-card h3 { margin-bottom: 10px; font-size: 1.2rem; }
    .step-card p { font-size: 0.9rem; margin: 0 auto; text-align: center; }

    /* ── MECHANISM ── */
    .mech h2 { text-align: center; margin-bottom: 16px; }
    .mech > .wrap > p { text-align: center; margin: 0 auto; }

    .compare {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0;
      margin: 48px 0; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .compare-col { padding: 36px 32px; }
    .compare-left { background: rgba(226,85,85,0.03); }
    .compare-right { background: rgba(212,175,55,0.03); border-left: 1px solid rgba(255,255,255,0.04); }
    .compare-head {
      font-family: var(--sans); font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      margin-bottom: 24px; display: flex; align-items: center; gap: 8px;
    }
    .compare-left .compare-head { color: var(--red-soft); }
    .compare-right .compare-head { color: var(--gold); }
    .compare-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    .compare-list li {
      font-size: 0.88rem; color: var(--text-mid); line-height: 1.6;
      padding-left: 24px; position: relative;
    }
    .compare-left .compare-list li::before { content: '✕'; position: absolute; left: 0; color: var(--red-soft); font-weight: 700; font-size: 0.8rem; }
    .compare-right .compare-list li::before { content: '✦'; position: absolute; left: 0; color: var(--gold); font-size: 0.75rem; }

    .engine-card {
      background: linear-gradient(155deg, var(--void-card), var(--void-mid));
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px; padding: 48px; position: relative; overflow: hidden;
    }
    .engine-card::after {
      content: ''; position: absolute; top: -40%; right: -15%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(91,82,240,0.05), transparent 70%);
      border-radius: 50%;
    }
    .engine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; position: relative; z-index: 1; }
    .eng-feat { margin-bottom: 26px; }
    .eng-feat h3 { margin-bottom: 8px; font-size: 1.15rem; }
    .eng-feat p { font-size: 0.92rem; }

    /* ── TOGGLE ── */
    .toggle-box {
      background: var(--void); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px; padding: 32px; text-align: center;
    }
    .toggle-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 18px;
    }
    .toggle-sw {
      display: inline-flex; background: var(--void-mid);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 50px; padding: 4px; cursor: pointer; margin-bottom: 24px;
    }
    .t-opt {
      padding: 11px 26px; font-family: var(--sans); font-weight: 600;
      font-size: 0.82rem; border-radius: 50px;
      color: var(--text-dim); transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
      user-select: none; position: relative; z-index: 2;
    }
    .t-opt.on-sub { color: var(--quantum-light); background: rgba(91,82,240,0.12); box-shadow: 0 0 18px rgba(91,82,240,0.08); }
    .t-opt.on-hyp { color: var(--gold); background: rgba(212,175,55,0.1); box-shadow: 0 0 18px rgba(212,175,55,0.06); }

    .t-display { min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.4s; }
    .t-display h3 { font-size: 1.05rem; margin-bottom: 8px; }
    .t-display p { font-size: 0.82rem; text-align: center; max-width: 290px; }

    /* ── FIRST SESSION TIMELINE ── */
    .timeline h2 { text-align: center; margin-bottom: 56px; }
    .tl-track { max-width: 680px; margin: 0 auto; position: relative; }
    .tl-track::before {
      content: ''; position: absolute; left: 24px; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(180deg, var(--quantum), var(--gold-dim), var(--gold));
    }
    .tl-item { display: flex; gap: 32px; margin-bottom: 36px; position: relative; }
    .tl-dot {
      width: 50px; min-width: 50px; height: 50px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: var(--sans); font-weight: 700; font-size: 0.7rem;
      color: var(--text); position: relative; z-index: 2;
    }
    .tl-dot.d1 { background: var(--void-mid); border: 1px solid rgba(91,82,240,0.2); }
    .tl-dot.d2 { background: var(--void-mid); border: 1px solid rgba(91,82,240,0.3); }
    .tl-dot.d3 { background: var(--void-mid); border: 1px solid rgba(139,132,255,0.3); }
    .tl-dot.d4 { background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.25); color: var(--gold); }
    .tl-dot.d5 { background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.15); }
    .tl-body h4 { font-family: var(--sans); font-weight: 700; font-size: 0.9rem; color: var(--text); margin-bottom: 4px; }
    .tl-body p { font-size: 0.88rem; }
    .tl-body .tl-state { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

    /* ── PRODUCT ── */
    .product { background: var(--void-up); }
    .product h2 { text-align: center; margin-bottom: 16px; }
    .product > .wrap > p { text-align: center; margin: 0 auto 48px; }

    .prod-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .prod-card {
      background: var(--void-card); border: 1px solid rgba(255,255,255,0.04);
      border-radius: 14px; padding: 32px 28px; position: relative; overflow: hidden;
    }
    .prod-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--quantum); opacity: 0.4;
    }
    .prod-card.bonus::before { background: var(--gold); opacity: 0.6; }
    .prod-emoji { font-size: 1.6rem; margin-bottom: 14px; display: block; }
    .prod-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .prod-card p { font-size: 0.85rem; }
    .prod-val {
      font-family: var(--sans); font-size: 0.72rem; font-weight: 700;
      color: var(--text-dim); text-decoration: line-through;
      margin-top: 14px; display: inline-block;
    }
    .bonus-badge {
      display: inline-block; font-family: var(--sans); font-size: 0.65rem;
      font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--void); background: var(--gold); padding: 3px 10px;

    /* skeleton loader */
    #pdp-content.loading { opacity: 0.5; pointer-events: none; }
    img { max-width: 100%; height: auto; }
  </style>

        <a href="/" style="color: var(--text-dim); text-decoration: none; font-size: 0.72rem; opacity: 0.6; letter-spacing: 0.1em; font-weight: 700; text-transform: uppercase;">Home</a>
        <a href="/shop.html" style="color: var(--text-dim); text-decoration: none; font-size: 0.72rem; opacity: 0.6; letter-spacing: 0.1em; font-weight: 700; text-transform: uppercase;">The Vault</a>

<script>
    async function loadProduct() {
        let productId = new URLSearchParams(window.location.search).get('id');
        if (!productId && window.location.pathname.startsWith('/products/')) {
            const parts = window.location.pathname.split('/');
            productId = parts[parts.length - 1];
        }
        if(!productId) { window.location.href = '/shop.html'; return; }
        try {
            const res = await fetch('/products.json');
            const products = await res.json();
            const product = products.find(p => p.id === productId);
            if(!product) { document.getElementById('pdp-content').innerHTML = '<h2>Product not found</h2>'; return; }
            document.title = `${product.title} - HigherSync Archive`;
            
            const benefitsHtml = product.benefits ? product.benefits.map(b => `<li>${b}</li>`).join('') : '';
            const faqHtml = product.faq ? product.faq.map(f => `
                <div class="faq-item-pdp">
                    <div class="faq-q-pdp">${f.q}</div>
                    <div class="faq-a-pdp">${f.a}</div>
                </div>
            `).join('') : '';
            
            const processHtml = product.howItWorks ? product.howItWorks.map((step, i) => `
                <div class="process-card">
                    <div class="process-num">0${i+1}</div>
                    <h4>Step 0${i+1}</h4>
                    <p>${step}</p>
                </div>
            `).join('') : '';

            const reviewsHtml = product.reviews ? product.reviews.map(r => `
                <div class="review-card">
                    <div class="review-header">
                        <span class="review-name">${r.name}</span>
                        <div class="review-stars">
                            ${Array(r.rating).fill('<i data-lucide="star" style="width: 12px; height: 12px; fill: currentColor;"></i>').join('')}
                        </div>
                    </div>
                    <div class="review-verified">
                        <i data-lucide="check-circle" style="width: 10px; height: 10px;"></i>
                        Verified Acquisition
                    </div>
                    <p class="review-text">"${r.text}"</p>
                </div>
            `).join('') : '';

            // Find relevant bundle for upsell
            const relevantStack = products.find(b => b.type === 'bundle' && b.id !== 'complete-collection' && b.included_ids.includes(product.id));
            const completeCollection = products.find(b => b.id === 'complete-collection');
            
            let upsellHtml = '';
            if (relevantStack || completeCollection) {
                upsellHtml = `
                <div class="pdp-section">
                    <span class="section-label">Upgrade Your Experience</span>
                    <h2 class="section-title">Synergistic Stacks</h2>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px;">
                        ${relevantStack ? `
                        <div class="upsell-section" style="margin-top: 0; height: 100%;">
                            <span class="upsell-badge">Stack & Save 30%</span>
                            <h3 class="upsell-title" style="font-size: 1.5rem;">${relevantStack.title}</h3>
                            <p style="font-size: 0.9rem; margin-bottom: 20px;">Includes this protocol plus synergistic frequencies for a complete neurological shift.</p>
                            <div class="upsell-price-box" style="margin-bottom: 20px;">
                                <span class="upsell-old-price" style="font-size: 1rem;">$${relevantStack.old_price}</span>
                                <span class="upsell-new-price" style="font-size: 1.8rem;">$${relevantStack.price}</span>
                            </div>
                            <a href="${relevantStack.checkout_link}" class="btn-buy" style="padding: 15px; font-size: 0.9rem; display: flex;">Get the Stack →</a>
                        </div>
                        ` : ''}

                        ${completeCollection && product.id !== 'complete-collection' ? `
                        <div class="upsell-section" style="margin-top: 0; height: 100%; border-color: var(--quantum); background: linear-gradient(155deg, rgba(91, 82, 240, 0.05), transparent);">
                            <span class="upsell-badge" style="background: var(--quantum); color: white;">Best Value | Save $212</span>
                            <h3 class="upsell-title" style="font-size: 1.5rem;">The Master Collection</h3>
                            <p style="font-size: 0.9rem; margin-bottom: 20px;">Instant lifetime access to all 13 Master Protocols and all future archive additions.</p>
                            <div class="upsell-price-box" style="margin-bottom: 20px;">
                                <span class="upsell-old-price" style="font-size: 1rem;">$${completeCollection.old_price}</span>
                                <span class="upsell-new-price" style="font-size: 1.8rem;">$${completeCollection.price}</span>
                            </div>
                            <a href="${completeCollection.checkout_link}" class="btn-buy" style="background: var(--quantum); color: white; border-color: var(--quantum); padding: 15px; font-size: 0.9rem; display: flex;">Unlock Everything →</a>
                        </div>
                        ` : ''}
                    </div>
                </div>
                `;
            }

            document.getElementById('pdp-content').innerHTML = `
                <div class="pdp-grid">
                    <div class="pdp-info-col">
                        <div class="tag">${product.tag}</div>
                        <div class="pdp-title-area">
                            <i data-lucide="${product.icon}" class="pdp-icon-svg" style="width: 32px; height: 32px;"></i>
                            <h1>${product.title}</h1>
                        </div>
                        <p style="font-size: 1.3rem; color: var(--text); font-weight: 500; line-height: 1.4; margin-top: 10px;">${product.short_desc}</p>
                        
                        <div class="sep" style="margin: 40px 0;"></div>
                        
                        <h3 style="margin-bottom: 25px; font-family: var(--sans); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--gold);">The Protocol Architecture</h3>
                        <p class="pdp-desc">${product.long_desc || ''}</p>
                        
                        <h3 style="margin-top: 50px; margin-bottom: 25px; font-family: var(--sans); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--gold);">Neurological Objectives</h3>
                        <ul class="benefits-list">
                            ${benefitsHtml}
                        </ul>
                    </div>
                    
                    <div class="pdp-sidebar">
                        <div class="pdp-cta-wrapper">
                            <div class="pdp-image-col">
                                <img src="/${product.image}" alt="${product.title}" class="pdp-main-image">
                            </div>
                            
                            <div class="pdp-price-area">
                                <div class="pdp-price-flex">
                                    <span class="pdp-price-label">Frequency License</span>
                                    <span class="pdp-price-value">
                                        ${product.old_price ? `<span class="pdp-price-old">$${product.old_price}</span>` : ''}
                                        ${product.price === 'Free' ? 'FREE' : '$' + product.price}
                                    </span>
                                </div>
                                <div class="pdp-price-sep"></div>
                                <div class="pdp-license-info">
                                    <i data-lucide="shield-check" style="width: 16px; height: 16px;"></i>
                                    Lifetime Digital Access
                                </div>
                            </div>
                            
                            <a href="${product.checkout_link}" class="btn-buy" id="main-buy-btn">Initialize Protocol</a>
                            
                            <div class="trust-badges">
                                <span>🔒 Encrypted</span>
                                <span>✅ Instant DL</span>
                                <span>💯 60-Day Guarantee</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── NEW: TARGETING SECTION ── -->
                <div class="pdp-section">
                    <span class="section-label">Target Audience</span>
                    <h2 class="section-title">Is this protocol right for you?</h2>
                    <div class="target-grid">
                        <div class="target-card">
                            <h4>This is NOT for you if:</h4>
                            <ul>
                                <li>You expect magical results without consistency.</li>
                                <li>You are unwilling to wear stereo headphones.</li>
                                <li>You prefer superficial "motivation" over deep neurological change.</li>
                            </ul>
                        </div>
                        <div class="target-card positive">
                            <h4>This IS for you if:</h4>
                            <ul>
                                <li>You are ready to bypass your conscious resistance.</li>
                                <li>You value scientifically-backed neuro-acoustic tools.</li>
                                <li>You want to rewrite your baseline state from the root level.</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- ── NEW: SCIENTIFIC PROCESS ── -->
                ${processHtml ? `
                <div class="pdp-section">
                    <span class="section-label">The Mechanism</span>
                    <h2 class="section-title">How the ${product.title} works</h2>
                    <div class="process-grid">
                        ${processHtml}
                    </div>
                </div>
                ` : ''}

                <!-- ── NEW: COMPARISON ── -->
                <div class="pdp-section">
                    <span class="section-label">The Advantage</span>
                    <h2 class="section-title">Why HigherSync is Different</h2>
                    <div class="comp-box">
                        <div class="comp-row comp-head">
                            <div class="comp-cell">Attribute</div>
                            <div class="comp-cell" style="justify-content: center;">Traditional Methods</div>
                            <div class="comp-cell" style="justify-content: center;">HigherSync</div>
                        </div>
                        <div class="comp-row">
                            <div class="comp-cell feature">Access Depth</div>
                            <div class="comp-cell others">Conscious Mind Only</div>
                            <div class="comp-cell us">Deep Subconscious Void</div>
                        </div>
                        <div class="comp-row">
                            <div class="comp-cell feature">Effort Required</div>
                            <div class="comp-cell others">High Discipline / Years</div>
                            <div class="comp-cell us">Passive Listening / Minutes</div>
                        </div>
                        <div class="comp-row">
                            <div class="comp-cell feature">Reliability</div>
                            <div class="comp-cell others">Hit or Miss</div>
                            <div class="comp-cell us">Neural Entrainment (Math)</div>
                        </div>
                    </div>
                </div>

                ${faqHtml ? `
                <div class="faq-section pdp-section">
                    <span class="section-label">F.A.Q.</span>
                    <h2 class="section-title">Detailed Specifications</h2>
                    <div class="faq-grid">
                        ${faqHtml}
                    </div>
                </div>
                ` : ''}

                <!-- ── NEW: CUSTOMER REVIEWS ── -->
                ${reviewsHtml ? `
                <div class="pdp-section">
                    <span class="section-label">Customer Experiences</span>
                    <h2 class="section-title">Unfiltered Feedback</h2>
                    <div class="reviews-grid">
                        ${reviewsHtml}
                    </div>
                </div>
                ` : ''}

                ${upsellHtml}

                <!-- ── NEW: BIG GUARANTEE ── -->
                <div class="pdp-guarantee">
                    <i data-lucide="shield" style="width: 48px; height: 48px; color: var(--gold); margin-bottom: 20px;"></i>
                    <h3>The 60-Day "Full Resonance" Guarantee</h3>
                    <p>Listen to the protocol for 60 days. If your baseline state doesn't shift, if you don't feel a profound neurological change, or if you are unsatisfied for any reason, we will refund 100% of your investment. No questions asked.</p>
                </div>

                <!-- ── FLOATING MOBILE BAR ── -->
                <div class="pdp-floating-cta" id="floatingBar">
                    <div class="floating-info">
                        <span class="floating-title">${product.title}</span>
                        <span class="floating-price">${product.price === 'Free' ? 'FREE' : '$' + product.price}</span>
                    </div>
                    <a href="${product.checkout_link}" class="btn-buy">Initialize</a>
                </div>
            `;
            lucide.createIcons();
            document.getElementById('pdp-content').classList.remove('loading');

            // Scroll Logic for Floating Bar
            const floatingBar = document.getElementById('floatingBar');
            const mainBuyBtn = document.getElementById('main-buy-btn');
            
            if (floatingBar && mainBuyBtn) {
                window.addEventListener('scroll', () => {
                    const rect = mainBuyBtn.getBoundingClientRect();
                    if (rect.bottom < 0) {
                        floatingBar.classList.add('show');
                    } else {
                        floatingBar.classList.remove('show');
                    }
                }, { passive: true });
            }
        } catch (e) {
            console.error("Error loading products", e);
        }

        // Mobile Menu Toggle
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        
        if (menuToggle && navLinks) {
          menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('open');
            navLinks.classList.toggle('open');
            document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';
          });

          navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
              menuToggle.classList.remove('open');
              navLinks.classList.remove('open');
              document.body.style.overflow = '';
            });
          });
        }
    }
    document.addEventListener("DOMContentLoaded", loadProduct);
</script>
